name: Update LeetCode Live Streak & Line Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-profile-visuals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Transparent 3D GitHub Graph & LeetCode Streak SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          # ==============================================================================
          # PART 1: TRANSPARENT 3D ISOMETRIC GITHUB GRAPH (Matches Reference Screenshots)
          # ==============================================================================
          gh_user = os.environ.get("GH_USER", "nitinbhandari912")
          gh_token = os.environ.get("GH_TOKEN", "")

          weeks_data = []
          total_gh_contribs = 0

          if gh_token:
              try:
                  gh_q = """
                  query($login: String!) {
                    user(login: $login) {
                      contributionsCollection {
                        contributionCalendar {
                          totalContributions
                          weeks {
                            contributionDays {
                              contributionCount
                              date
                            }
                          }
                        }
                      }
                    }
                  }
                  """
                  req = urllib.request.Request(
                      "https://api.github.com/graphql",
                      data=json.dumps({"query": gh_q, "variables": {"login": gh_user}}).encode("utf-8"),
                      headers={
                          "Authorization": f"Bearer {gh_token}",
                          "Content-Type": "application/json",
                          "User-Agent": "Mozilla/5.0"
                      }
                  )
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      cal = json.loads(resp.read().decode("utf-8"))["data"]["user"]["contributionsCollection"]["contributionCalendar"]
                      total_gh_contribs = cal["totalContributions"]
                      weeks_data = cal["weeks"]
              except Exception:
                  pass

          # Calculate GitHub Streaks & Best Day
          all_days = []
          for w_idx, w in enumerate(weeks_data):
              for d_idx, day in enumerate(w.get("contributionDays", [])):
                  c = int(day.get("contributionCount", 0))
                  dt = day.get("date", "")
                  all_days.append((w_idx, d_idx, c, dt))

          longest_streak = 0
          longest_start, longest_end = "", ""
          cur_run = 0
          cur_start = ""
          best_day_count = 0
          best_day_date = ""

          for _, _, c, dt in all_days:
              if c > best_day_count:
                  best_day_count = c
                  best_day_date = dt
              if c > 0:
                  if cur_run == 0:
                      cur_start = dt
                  cur_run += 1
                  if cur_run > longest_streak:
                      longest_streak = cur_run
                      longest_start = cur_start
                      longest_end = dt
              else:
                  cur_run = 0

          # Current GitHub Streak (check today or yesterday)
          gh_current_streak = 0
          if all_days:
              idx = len(all_days) - 1
              if all_days[idx][2] == 0 and idx > 0:
                  idx -= 1
              while idx >= 0 and all_days[idx][2] > 0:
                  gh_current_streak += 1
                  idx -= 1

          max_day_c = max([x[2] for x in all_days], default=1)
          if max_day_c < 1:
              max_day_c = 1

          # Build Isometric 3D Cubes (Back-to-Front Painter's Algorithm)
          dx, dy = 7.2, 4.15
          ox, oy = 95.0, 58.0
          cubes_svg = []

          def get_colors(c):
              if c == 0:
                  return ("#161b22", "#0d1117", "#090d11", "0.65")
              ratio = c / max_day_c
              if ratio <= 0.25:
                  return ("#0e4429", "#0a321e", "#062114", "1.0")
              elif ratio <= 0.50:
                  return ("#006d32", "#005326", "#003b1b", "1.0")
              elif ratio <= 0.75:
                  return ("#26a641", "#1d8032", "#145923", "1.0")
              else:
                  return ("#39d353", "#2bb042", "#1e8230", "1.0")

          for w_idx, d_idx, c, _ in all_days:
              x = ox + w_idx * dx - d_idx * dx
              y = oy + w_idx * dy + d_idx * dy
              h = 2.5 if c == 0 else (6.0 + (c / max_day_c) * 68.0)
              c_top, c_left, c_right, op = get_colors(c)

              top_pts = f"{x:.1f},{y-h:.1f} {x+dx:.1f},{y+dy-h:.1f} {x:.1f},{y+2*dy-h:.1f} {x-dx:.1f},{y+dy-h:.1f}"
              left_pts = f"{x-dx:.1f},{y+dy-h:.1f} {x:.1f},{y+2*dy-h:.1f} {x:.1f},{y+2*dy:.1f} {x-dx:.1f},{y+dy:.1f}"
              right_pts = f"{x:.1f},{y+2*dy-h:.1f} {x+dx:.1f},{y+dy-h:.1f} {x+dx:.1f},{y+dy:.1f} {x:.1f},{y+2*dy:.1f}"

              cubes_svg.append(
                  f'<g opacity="{op}">'
                  f'<polygon points="{left_pts}" fill="{c_left}"/>'
                  f'<polygon points="{right_pts}" fill="{c_right}"/>'
                  f'<polygon points="{top_pts}" fill="{c_top}"/>'
                  f'</g>'
              )

          # Bottom 1-Year Spike Line Chart (like Screenshot 4)
          line_pts = []
          n_days = max(len(all_days), 1)
          lx0, lx1 = 20.0, 620.0
          ly0, ly1 = 315.0, 385.0
          for i, (_, _, c, _) in enumerate(all_days):
              px = lx0 + (i / max(n_days - 1, 1)) * (lx1 - lx0)
              py = ly1 - (c / max_day_c) * (ly1 - ly0)
              line_pts.append(f"{px:.1f},{py:.1f}")

          poly_str = " ".join(line_pts) if line_pts else f"{lx0},{ly1} {lx1},{ly1}"
          area_str = f"{lx0},{ly1} " + poly_str + f" {lx1},{ly1}"

          gh_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none">
            <defs>
              <linearGradient id="ghWave" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#39d353" stop-opacity="0.42"/>
                <stop offset="100%" stop-color="#39d353" stop-opacity="0.0"/>
              </linearGradient>
            </defs>

            <!-- Top-Left Total Header -->
            <text x="20" y="24" fill="#e6edf3" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="600">{total_gh_contribs} contributions in the last year</text>

            <!-- Top-Right Streak Corner (Matches Screenshot 4) -->
            <text x="415" y="52" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="500">Longest Streak</text>
            <text x="515" y="55" fill="#39d353" font-family="Segoe UI, Ubuntu, sans-serif" font-size="24" font-weight="800">{longest_streak}</text>
            <text x="552" y="44" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="10">Days</text>
            <text x="552" y="57" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="9.5">{longest_start} to {longest_end}</text>

            <text x="415" y="92" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="500">Current Streak</text>
            <text x="515" y="95" fill="#39d353" font-family="Segoe UI, Ubuntu, sans-serif" font-size="24" font-weight="800">{gh_current_streak}</text>
            <text x="552" y="90" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="10">Days</text>

            <!-- Best Day Bottom-Left Callout -->
            <text x="35" y="238" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="500">Best Day</text>
            <text x="95" y="242" fill="#39d353" font-family="Segoe UI, Ubuntu, sans-serif" font-size="24" font-weight="800">{best_day_count}</text>
            <text x="132" y="230" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="10">commits</text>
            <text x="132" y="243" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="9.5">{best_day_date}</text>

            <!-- 3D Isometric Contribution Towers -->
            {"".join(cubes_svg)}

            <!-- Bottom Activity Spike Graph -->
            <polygon points="{area_str}" fill="url(#ghWave)"/>
            <polyline fill="none" stroke="#2ea043" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" points="{poly_str}"/>
          </svg>'''

          with open("github-3d.svg", "w", encoding="utf-8") as f:
              f.write(gh_svg)

          # ==============================================================================
          # PART 2: LEETCODE DAILY CHALLENGE STREAK SVG
          # ==============================================================================
          USERNAME = "N_LUCARIO"
          url = "https://leetcode.com/graphql"

          def gql_request(query, variables):
              payload = json.dumps({"query": query, "variables": variables}).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=payload,
                  headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode("utf-8"))["data"]

          user_data = gql_request("""
          query getUserData($username: String!) {
            matchedUser(username: $username) {
              submitStatsGlobal { acSubmissionNum { difficulty count } }
              userCalendar { submissionCalendar }
            }
            recentAcSubmissionList(username: $username, limit: 100) {
              titleSlug
              timestamp
            }
          }
          """, {"username": USERNAME})

          matched = user_data["matchedUser"]
          recent_ac = user_data.get("recentAcSubmissionList") or []
          stats = {item["difficulty"]: item["count"] for item in matched["submitStatsGlobal"]["acSubmissionNum"]}
          total_solved = stats.get("All", 0)
          easy_solved = stats.get("Easy", 0)
          med_solved = stats.get("Medium", 0)
          hard_solved = stats.get("Hard", 0)

          today = datetime.now(timezone.utc).date()
          first_of_this_month = today.replace(day=1)
          prev_month_date = first_of_this_month - timedelta(days=1)

          dcc_query = """
          query getDaily($year: Int!, $month: Int!) {
            dailyCodingChallengeV2(year: $year, month: $month) {
              challenges { date question { titleSlug } }
            }
          }
          """
          daily_slug_by_date = {}
          for y, m in [(prev_month_date.year, prev_month_date.month), (today.year, today.month)]:
              try:
                  dcc_data = gql_request(dcc_query, {"year": y, "month": m})
                  for ch in (dcc_data.get("dailyCodingChallengeV2") or {}).get("challenges") or []:
                      d_str = ch.get("date")
                      slug = (ch.get("question") or {}).get("titleSlug")
                      if d_str and slug:
                          daily_slug_by_date[d_str] = slug
              except Exception:
                  pass

          ac_dates_by_slug = {}
          for item in recent_ac:
              slug = item.get("titleSlug")
              ts = int(item.get("timestamp", 0))
              if slug and ts > 0:
                  ac_date_str = datetime.fromtimestamp(ts, tz=timezone.utc).strftime("%Y-%m-%d")
                  ac_dates_by_slug.setdefault(slug, set()).add(ac_date_str)

          def solved_daily_on(d_obj):
              d_str = d_obj.strftime("%Y-%m-%d")
              target_slug = daily_slug_by_date.get(d_str)
              return bool(target_slug and d_str in ac_dates_by_slug.get(target_slug, set()))

          yesterday = today - timedelta(days=1)
          daily_challenge_streak = 0
          if solved_daily_on(today):
              curr = today
              while solved_daily_on(curr):
                  daily_challenge_streak += 1
                  curr -= timedelta(days=1)
          elif solved_daily_on(yesterday):
              curr = yesterday
              while solved_daily_on(curr):
                  daily_challenge_streak += 1
                  curr -= timedelta(days=1)

          streak_color = "#39d353" if daily_challenge_streak > 0 else "#ef4444"
          status_text = "Daily Challenge Active" if daily_challenge_streak > 0 else "0 Daily Challenge Streak"

          lc_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150" fill="none">
            <rect x="2" y="2" width="496" height="146" rx="10" fill="#161b22" fill-opacity="0.55" stroke="#30363d" stroke-width="1"/>
            <text x="24" y="32" fill="#e6edf3" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700">LeetCode Daily Challenge Streak — @{USERNAME}</text>
            <line x1="20" y1="44" x2="480" y2="44" stroke="#21262d" stroke-width="1"/>

            <text x="95" y="72" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DAILY STREAK</text>
            <text x="95" y="108" fill="{streak_color}" font-family="Segoe UI, Ubuntu, sans-serif" font-size="30" font-weight="800" text-anchor="middle">{daily_challenge_streak} <tspan font-size="14">Days</tspan></text>
            <text x="95" y="128" fill="{streak_color}" font-family="Segoe UI, Ubuntu, sans-serif" font-size="10" font-weight="600" text-anchor="middle">{status_text}</text>

            <line x1="185" y1="56" x2="185" y2="132" stroke="#21262d" stroke-width="1"/>

            <text x="265" y="72" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TOTAL SOLVED</text>
            <text x="265" y="108" fill="#ffa116" font-family="Segoe UI, Ubuntu, sans-serif" font-size="30" font-weight="800" text-anchor="middle">{total_solved}</text>
            <text x="265" y="128" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="10" text-anchor="middle">Questions Accepted</text>

            <line x1="345" y1="56" x2="345" y2="132" stroke="#21262d" stroke-width="1"/>

            <text x="420" y="72" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BREAKDOWN</text>
            <text x="420" y="95" fill="#2cbb5d" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Easy: {easy_solved}</text>
            <text x="420" y="112" fill="#ffc01e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Medium: {med_solved}</text>
            <text x="420" y="129" fill="#ef4743" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Hard: {hard_solved}</text>
          </svg>'''

          with open("leetcode-streak.svg", "w", encoding="utf-8") as f:
              f.write(lc_svg)
          EOF

      - name: Commit and Push Updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode-streak.svg github-3d.svg
          git diff --staged --quiet || git commit -m "chore: update transparent 3D GitHub graph and LeetCode streak"
          git push
