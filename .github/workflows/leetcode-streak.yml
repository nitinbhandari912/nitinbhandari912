name: Update LeetCode Live Streak & Line Graph

on:
  schedule:
    - cron: "0 */6 * * *" # Runs automatically every 6 hours
  workflow_dispatch:      # Lets you run it manually anytime
  push:
    branches:
      - main

jobs:
  update-leetcode-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch LeetCode Streak & Generate SVG
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          from datetime import datetime, timezone, timedelta

          USERNAME = "N_LUCARIO"
          url = "https://leetcode.com/graphql"
          query = """
          query getUserData($username: String!) {
            matchedUser(username: $username) {
              submitStatsGlobal {
                acSubmissionNum {
                  difficulty
                  count
                }
              }
              userCalendar {
                streak
                totalActiveDays
                submissionCalendar
              }
            }
          }
          """

          payload = json.dumps({"query": query, "variables": {"username": USERNAME}}).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(req, timeout=15) as resp:
              data = json.loads(resp.read().decode("utf-8"))["data"]["matchedUser"]

          # Parse Solved Counts
          stats = {item["difficulty"]: item["count"] for item in data["submitStatsGlobal"]["acSubmissionNum"]}
          total_solved = stats.get("All", 0)
          easy_solved = stats.get("Easy", 0)
          med_solved = stats.get("Medium", 0)
          hard_solved = stats.get("Hard", 0)

          # Parse Daily Submission Calendar (UTC dates)
          cal_raw = json.loads(data["userCalendar"]["submissionCalendar"] or "{}")
          date_counts = {}
          for ts_str, count in cal_raw.items():
              if count > 0:
                  d = datetime.fromtimestamp(int(ts_str), tz=timezone.utc).date()
                  date_counts[d] = date_counts.get(d, 0) + count

          today = datetime.now(timezone.utc).date()
          yesterday = today - timedelta(days=1)

          # Exact Current Streak Logic:
          # If solved today, count backwards from today.
          # If not yet solved today, check if streak is alive from yesterday.
          # Otherwise, streak is 0.
          current_streak = 0
          if today in date_counts:
              curr = today
              while curr in date_counts:
                  current_streak += 1
                  curr -= timedelta(days=1)
          elif yesterday in date_counts:
              curr = yesterday
              while curr in date_counts:
                  current_streak += 1
                  curr -= timedelta(days=1)
          else:
              current_streak = 0

          # Compute Longest Streak
          sorted_dates = sorted(date_counts.keys())
          longest_streak = data["userCalendar"].get("streak") or 0
          run = 0
          prev = None
          for d in sorted_dates:
              if prev is not None and (d - prev).days == 1:
                  run += 1
              else:
                  run = 1
              if run > longest_streak:
                  longest_streak = run
              prev = d

          # Build 60-Day Submission Line Graph Points (like Screenshot 4)
          days_window = 60
          series = []
          for i in range(days_window - 1, -1, -1):
              d = today - timedelta(days=i)
              series.append(date_counts.get(d, 0))

          max_val = max(series) if max(series) > 0 else 1
          chart_x0, chart_x1 = 30, 470
          chart_y0, chart_y1 = 205, 285
          width_px = chart_x1 - chart_x0
          height_px = chart_y1 - chart_y0

          pts = []
          for idx, val in enumerate(series):
              x = chart_x0 + (idx / (days_window - 1)) * width_px
              y = chart_y1 - (val / max_val) * height_px
              pts.append(f"{x:.1f},{y:.1f}")

          polyline_pts = " ".join(pts)
          area_pts = f"{chart_x0},{chart_y1} " + polyline_pts + f" {chart_x1},{chart_y1}"

          streak_color = "#22c55e" if current_streak > 0 else "#ef4444"
          status_text = "Active Streak" if current_streak > 0 else "No Active Streak"
          updated_str = datetime.now(timezone(timedelta(hours=5, minutes=30))).strftime("%d %b %Y")

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="500" height="315" viewBox="0 0 500 315">
            <defs>
              <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#22c55e" stop-opacity="0.45"/>
                <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0"/>
              </linearGradient>
            </defs>
            <rect width="500" height="315" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

            <!-- Header -->
            <text x="25" y="32" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="16" font-weight="700">LeetCode Live Streak &amp; Activity — @{USERNAME}</text>
            <text x="475" y="32" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" text-anchor="end">Updated: {updated_str}</text>
            <line x1="20" y1="45" x2="480" y2="45" stroke="#21262d" stroke-width="1"/>

            <!-- Left Stat: Current Streak -->
            <rect x="20" y="58" width="145" height="105" rx="8" fill="#161b22" stroke="#21262d"/>
            <text x="92.5" y="80" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CURRENT STREAK</text>
            <text x="92.5" y="122" fill="{streak_color}" font-family="Segoe UI, Ubuntu, sans-serif" font-size="34" font-weight="800" text-anchor="middle">{current_streak} <tspan font-size="15" font-weight="600">Days</tspan></text>
            <text x="92.5" y="146" fill="{streak_color}" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="600" text-anchor="middle">{status_text}</text>

            <!-- Middle Stat: Longest Streak -->
            <rect x="177.5" y="58" width="145" height="105" rx="8" fill="#161b22" stroke="#21262d"/>
            <text x="250" y="80" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LONGEST STREAK</text>
            <text x="250" y="122" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="34" font-weight="800" text-anchor="middle">{longest_streak} <tspan font-size="15" font-weight="600">Days</tspan></text>
            <text x="250" y="146" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" text-anchor="middle">All-Time Record</text>

            <!-- Right Stat: Total Solved -->
            <rect x="335" y="58" width="145" height="105" rx="8" fill="#161b22" stroke="#21262d"/>
            <text x="407.5" y="80" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TOTAL SOLVED</text>
            <text x="407.5" y="122" fill="#ffa116" font-family="Segoe UI, Ubuntu, sans-serif" font-size="34" font-weight="800" text-anchor="middle">{total_solved}</text>
            <text x="407.5" y="146" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="10.5" text-anchor="middle">E: {easy_solved}  •  M: {med_solved}  •  H: {hard_solved}</text>

            <!-- Bottom Line Graph Section -->
            <text x="25" y="188" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="600">DAILY LEETCODE SUBMISSIONS (LAST 60 DAYS)</text>
            <line x1="30" y1="285" x2="470" y2="285" stroke="#21262d" stroke-width="1"/>
            <polygon points="{area_pts}" fill="url(#areaGrad)"/>
            <polyline fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="{polyline_pts}"/>
          </svg>'''

          with open("leetcode-streak.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          EOF

      - name: Commit and Push Updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode-streak.svg
          git diff --staged --quiet || git commit -m "chore: update live LeetCode streak and line graph"
          git push
